<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080f">
<meta name="description" content="Tactics Core — isometric 2.5D turn-based tactics, built in Godot 4 and running in the browser.">
<title>Tactics Core</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9876;</text></svg>">
<style>
  /* The shell is deliberately tiny and inline: it is the only thing on screen
     while the ~30 MB engine wasm streams in, so it must not need any request
     of its own. */
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#07080f; }
  body {
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:#e9ebf4;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block; width:100%; height:100%; outline:none;
    touch-action:none; image-rendering:auto;
  }
  canvas:focus { outline:none; }
  #boot {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:5;
    background:radial-gradient(900px 600px at 50% 35%,#1a1e33,#07080f 70%);
    transition:opacity .45s ease;
  }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot h1 {
    font-size:clamp(20px,5vw,32px); letter-spacing:6px; text-transform:uppercase; margin:0;
    background:linear-gradient(90deg,#e8c66a,#fff,#e8c66a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #boot p { margin:0; font-size:12px; letter-spacing:2px; color:#98a0c4; text-transform:uppercase; }
  #track { width:min(320px,70vw); height:6px; border-radius:3px; background:#171a2b; overflow:hidden; }
  #fill { height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg,#5b8def,#e8c66a); transition:width .2s; }
  #status { font-size:12px; color:#98a0c4; min-height:18px; text-align:center; padding:0 18px; }
  #status.error { color:#e05b5b; max-width:560px; line-height:1.5; }
  .tile { width:54px; height:27px; background:#4e7a45; transform:rotate(45deg) scaleY(.58); border-radius:3px;
          box-shadow:0 10px 0 #2f4d2b; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform:rotate(45deg) scaleY(.58) translateY(0);} 50%{ transform:rotate(45deg) scaleY(.58) translateY(-6px);} }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>

<div id="boot">
  <div class="tile"></div>
  <h1>Tactics Core</h1>
  <p>Isometric 2.5D Tactics</p>
  <div id="track"><div id="fill"></div></div>
  <div id="status">Loading engine…</div>
</div>

<script src="$GODOT_URL"></script>
<script>
const boot = document.getElementById("boot");
const fill = document.getElementById("fill");
const status = document.getElementById("status");
const canvas = document.getElementById("canvas");

function fatal(msg) {
  status.className = "error";
  status.innerHTML = msg;
  fill.style.background = "#e05b5b";
}

if (!("WebAssembly" in window)) {
  fatal("This browser has no WebAssembly support. Try a current version of Chrome, Firefox, Edge or Safari.");
} else {
  const config = $GODOT_CONFIG;
  // A couple of whitelisted query parameters, so the build can be demoed or
  // smoke-tested from a plain URL: index.html?autoplay=1&chapter=3
  const q = new URLSearchParams(location.search);
  const extra = [];
  if (q.has("autoplay")) extra.push("--autoplay");
  if (q.has("chapter")) {
    const n = parseInt(q.get("chapter"), 10);
    if (n >= 1 && n <= 4) extra.push("--chapter=" + n);
  }
  if (extra.length) config.args = (config.args || []).concat(["--"], extra);

  const engine = new Engine(config);
  engine.startGame({
    onProgress: (current, total) => {
      if (total > 0) {
        fill.style.width = Math.min(100, (current / total) * 100) + "%";
        status.textContent = "Loading " + Math.round((current / total) * 100) + "%";
      } else {
        // Server did not send Content-Length; show an indeterminate crawl.
        fill.style.width = "60%";
        status.textContent = "Loading…";
      }
    },
  }).then(() => {
    fill.style.width = "100%";
    status.textContent = "Ready";
    boot.classList.add("gone");
    setTimeout(() => boot.remove(), 500);
    canvas.focus();
  }).catch(err => {
    console.error(err);
    fatal("The game failed to start.<br><br><code style='font-size:11px'>" +
          String(err).replace(/</g, "&lt;") + "</code>");
  });
}
</script>
</body>
</html>
