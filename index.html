<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080f">
<meta name="description" content="Tactics Core — an isometric 2.5D turn-based tactics game in the browser. Height, facing, charge-time turns and a four-chapter campaign.">
<title>Tactics Core — Isometric Tactics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚔</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="topbar">
      <div id="chapter" class="panel">
        <div class="title">Tactics Core</div>
        <div class="obj">Loading…</div>
      </div>
      <div id="timeline" class="panel"></div>
      <div id="tools">
        <button class="iconbtn" id="btnRotL" title="Rotate camera left (Q)">⟲</button>
        <button class="iconbtn" id="btnRotR" title="Rotate camera right (E)">⟳</button>
        <button class="iconbtn" id="btnZoomIn" title="Zoom in (+)">＋</button>
        <button class="iconbtn" id="btnZoomOut" title="Zoom out (−)">－</button>
        <button class="iconbtn" id="btnSound" title="Sound effects">🔊</button>
        <button class="iconbtn" id="btnMusic" title="Music">🎵</button>
        <button class="iconbtn" id="btnHelp" title="How to play (H)">?</button>
        <button class="iconbtn" id="btnMenu" title="Menu">☰</button>
      </div>
    </div>

    <div id="hint"></div>
    <div id="unitcard" class="panel"></div>
    <div id="inspect" class="panel"></div>
    <div id="preview" class="panel"></div>
    <div id="actionbar"></div>
    <div id="logbox" class="panel"></div>
  </div>

  <div id="modal"><div class="sheet" id="sheet"></div></div>
</div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/battle.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
